spring.application.name=kairo-backend
server.port=9091

# ── Datasource: LOCAL clone of the Azure DB (never point at live for dev) ──
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kairo_local}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the kairo_* tables from the entities (same approach as QuikHire).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Auth (same HS256 secret contract as QuikHire so tokens are compatible) ──
app.jwt.secret=${JWT_SECRET:w4NafRp8sV3Dt8o2tWyS+lJwn8k+H8q9DjRjMAnw5HU=}
app.jwt.expiration-days=90

# CORS — the Kairo frontend origin(s)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Email (optional; used later for OTP / reset)
spring.mail.host=${SPRING_MAIL_HOST:smtp.zoho.in}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:hirereqpedia@zohomail.in}
spring.mail.password=${SPRING_MAIL_PASSWORD:wCgsE4iCYLFy}

server.error.include-message=always

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.zoho.in}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend base URL (used to build the password-reset link)
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5180}

# Resume upload (multipart) limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
